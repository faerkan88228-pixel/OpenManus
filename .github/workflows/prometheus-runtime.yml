name: Prometheus OpenManus Runtime Tests

on:
  push:
    branches:
      - main
      - "prometheus/**"
  pull_request:
    branches:
      - main
    paths:
      - "app/prometheus_runtime.py"
      - "tests/test_prometheus_runtime*.py"
      - "app/agent/**"
      - "app/tool/**"
      - "app/config.py"
      - "requirements.txt"
      - ".github/workflows/prometheus-runtime.yml"

permissions:
  contents: read

jobs:
  runtime-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run runtime contract tests
        env:
          PROMETHEUS_RUNTIME_TOKEN: ci-test-token
        run: python -m pytest -q tests/test_prometheus_runtime.py tests/test_prometheus_runtime_api.py
